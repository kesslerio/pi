name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, firstmate-sdk-v1.2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Release validation must use its pinned catalog, not today's upstream models.
      - name: Hydrate pinned release model catalog
        if: github.base_ref == 'firstmate-sdk-v1.2'
        run: |
          revision="$(node -p 'require("./nix/model-catalog.json").revision')"
          catalog="${RUNNER_TEMP}/pi-model-catalog.json"
          curl --fail --silent --show-error --location "https://pi.dev/api/models/revisions/${revision}?types=chat,image,classifier" --output "$catalog"
          printf '%s  %s\n' "${revision#sha256-}" "$catalog" | sha256sum --check --strict
          node packages/ai/scripts/hydrate-model-catalog.ts "$catalog"

      - name: Build
        run: |
          if [[ "$GITHUB_BASE_REF" == "firstmate-sdk-v1.2" ]]; then
            npm run build:offline
          else
            npm run build
          fi

      - name: Check
        run: npm run check

      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      - name: Test
        run: npm test

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
